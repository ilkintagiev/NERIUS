<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unified AI Student Document Generator</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- HTML2Canvas for capturing DOM as image -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- jsPDF for generating PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <!-- JSZip for creating zip files -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&family=Inter:wght@400;500;700&family=Tinos:wght@400;700&display=swap" rel="stylesheet">
    <style>
        .preview-container { border: 1px solid #ccc; box-shadow: 0 0 10px rgba(0,0,0,0.1); transform-origin: top center; margin-bottom: 1rem; background: white; }
        .id-card-container { width: 3.375in; height: 2.125in; font-family: 'Roboto', sans-serif; }
        .receipt-container, .schedule-container { width: 8.5in; min-height: 11in; font-family: 'Tinos', serif; padding: 0.75in; }
        .form-label { @apply block text-sm font-medium text-gray-700 mb-1; }
        .form-input { @apply mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm; }
        .modern-button { @apply inline-flex items-center justify-center px-4 py-2 border border-transparent text-sm font-medium rounded-md shadow-sm text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 disabled:opacity-50; }
        .spinner { border: 2px solid #f3f3f3; border-top: 2px solid #4F46E5; border-radius: 50%; width: 16px; height: 16px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .image-container { position: relative; }
        .image-container .spinner-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,0.7); display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body class="font-sans bg-gray-100 min-h-screen flex items-start justify-center p-4">
    <div class="flex flex-col lg:flex-row bg-white rounded-lg shadow-xl overflow-hidden w-full max-w-screen-2xl">
        <!-- Left Panel: Edit Area -->
        <div class="w-full lg:w-1/3 p-6 md:p-8 border-r border-gray-200 overflow-y-auto" style="max-height: 95vh;">
            <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">Document Generator</h2>
            <div id="form-container" class="space-y-4">
                 <div><label class="form-label">College Name:</label>
                    <input type="text" id="college_name" class="form-input" list="college_list" placeholder="Select or type a college name">
                    <datalist id="college_list"></datalist>
                 </div>
                 <button id="generate_button" class="modern-button w-full mt-4">
                    <span class="button-text">✨ Сгенерировать все документы с AI</span>
                 </button>
                 <button id="download_zip_button" class="modern-button w-full mt-2 hidden bg-green-600 hover:bg-green-700">
                    📦 Скачать все (.zip)
                 </button>
            </div>
        </div>

        <!-- Right Panel: Live Previews -->
        <div class="w-full lg:w-2/3 p-6 md:p-8 flex flex-col items-center justify-start bg-gray-50 overflow-y-auto" style="max-height: 95vh;">
            <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">Live Previews</h2>
            
            <div class="w-full grid grid-cols-1 xl:grid-cols-2 gap-6">
                <div>
                    <h3 class="font-bold text-lg mb-2">ID Card</h3>
                    <div id="idCardPreview-front" class="preview-container id-card-container"></div>
                </div>
                <div>
                    <h3 class="font-bold text-lg mb-2">Data File (info.txt)</h3>
                    <pre id="info_txt_preview" class="bg-gray-100 p-4 rounded-md text-xs whitespace-pre-wrap h-48"></pre>
                </div>
            </div>
            
            <div class="w-full mt-6">
                <h3 class="font-bold text-lg mb-2">Fee Receipt</h3>
                <div id="receiptPreview" class="preview-container receipt-container" style="transform: scale(0.5);"></div>
            </div>

            <div class="w-full mt-6">
                <h3 class="font-bold text-lg mb-2">Class Schedule</h3>
                <div id="schedulePreview" class="preview-container schedule-container" style="transform: scale(0.5);"></div>
            </div>
        </div>
    </div>
</body>
</html>
